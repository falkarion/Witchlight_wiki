name: Deploy the prebuilt site to GitHub Pages

# The site is built locally (npx quartz build) and the finished `public/` folder is
# committed. The page sources in `content/` never leave the DM's PC, so private player
# pages only ever reach GitHub in encrypted form.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
